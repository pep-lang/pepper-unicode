[package]
name = "unicode"
version = "1.1.0"
description = "Unicode normalization, grapheme and word segmentation, display width and case folding"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper-unicode"
# The oldest Pepper toolchain that builds the package (0.12 reads a string
# literal's bytes from 0x80 up, pep-lang/pepper#298, which pepper-trie 0.2
# needs too): CI also tests with it, and `pepper package` skips a version
# whose minimum is newer than the user's toolchain.
minimum_toolchain = "0.12.0"

# The build script (build.pep) builds the package's data into StaticTries;
# the module it generates names their type.
[build-dependencies]
trie = { github = "pep-lang/pepper-trie", version = "0.2.0" }

[dependencies]
trie = { github = "pep-lang/pepper-trie", version = "0.2.0" }
